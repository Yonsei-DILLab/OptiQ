# DIME training and critic settings. Only the actor is replaced by OptiQ.
tau: 1.0
policy_tau: 1.0
utd: 2
gamma: 0.99
# OptiQ's supplied actor update frequency takes precedence over DIME's delay of 3.
policy_delay: 1
batch_size: 256
buffer_size: 1000000
learning_starts: 5000
reset_models: false

# OptiQ has no tractable diffusion path entropy. The supplied setup uses alpha=0.
ent_coef:
  type: const
  init: 0.0

# Kept identical to the public DIME DMC configuration.
critic:
  activation: relu
  n_critics: 2
  hs: [2048, 2048]
  dropout_rate: null
  use_layer_norm: false
  n_atoms: 101
  v_min: -200
  v_max: 200
  entr_coeff: 0.005

optimizer:
  bn: true
  bn_momentum: 0.99
  bn_mode: brn_actor
  bn_warmup: 100000
  lr_critic: 3.0e-4
  lr_actor: 3.0e-4
  critic_b1: 0.5
  critic_b2: 0.999
  actor_b1: 0.9
  actor_b2: 0.999

# Ported from the supplied online OptiFlow/OptiQ configuration.
actor:
  hidden_dims: [256, 256, 256]
  num_policy_samples: 16
  proposals_per_policy_sample: 5
  # skewed: draw from the same 2.5-sigma radial truncation, then keep or
  # reflect each perturbation using its pairwise linearized Boltzmann score.
  # This adds no proposal-specific tuning beyond std and clip.  Temperature
  # remains only in the Boltzmann target weights, not in proposal geometry.
  proposal_sampling_mode: skewed
  proposal_std: 0.2
  # The radial Mahalanobis cap is proposal_clip / proposal_std = 2.5.
  proposal_clip: 0.5
  include_anchor: true
  density_correction: true
  # Fixed beta=1 reproduces exact density correction.  Adaptive mode selects
  # the largest per-state beta whose 80 source weights retain the requested ESS.
  density_beta: 1.0
  adaptive_density_beta: false
  minimum_source_ess: 16.0
  density_beta_grid_size: 257
  source_q_eval: mean
  source_reference: uniform_action
  temperature: 0.25
  sinkhorn_epsilon: 0.05
  sinkhorn_iterations: 30
  transport_target_mode: argmax
  td_noise_std: 0.2
  td_noise_clip: 0.5
