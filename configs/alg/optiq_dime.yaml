# DIME training and critic settings. Only the actor is replaced by OptiQ.
tau: 1.0
policy_tau: 1.0
utd: 2
gamma: 0.99
# OptiQ's supplied actor update frequency takes precedence over DIME's delay of 3.
policy_delay: 1
batch_size: 256
buffer_size: 1000000
learning_starts: 5000
reset_models: false

# OptiQ has no tractable diffusion path entropy. The supplied setup uses alpha=0.
ent_coef:
  type: const
  init: 0.0

# Kept identical to the public DIME DMC configuration.
critic:
  activation: relu
  n_critics: 2
  hs: [2048, 2048]
  dropout_rate: null
  use_layer_norm: false
  n_atoms: 101
  v_min: -200
  v_max: 200
  entr_coeff: 0.005

optimizer:
  bn: true
  bn_momentum: 0.99
  bn_mode: brn_actor
  bn_warmup: 100000
  lr_critic: 3.0e-4
  lr_actor: 3.0e-4
  critic_b1: 0.5
  critic_b2: 0.999
  actor_b1: 0.9
  actor_b2: 0.999

# Ported from the supplied online OptiFlow/OptiQ configuration.
actor:
  hidden_dims: [256, 256, 256]
  num_policy_samples: 16
  proposals_per_policy_sample: 5
  # Proposal geometry is independent of component allocation below.
  # Choices: isotropic_truncated, qgradcov_truncated, qgradcov_gaussian,
  # gamma_qgradcov_gaussian.
  proposal_family: isotropic_truncated
  # stratified: equal random draws per center; exact: independently choose each
  # random proposal's center from the uniform KDE mixture. Anchors are unchanged.
  proposal_sampling_mode: stratified
  proposal_std: 0.2
  proposal_clip: 0.5
  proposal_perpendicular_std_ratio: 0.5
  gamma_shape: 2.0
  gamma_scale: 0.1
  gamma_perpendicular_std: 0.1
  # Clipping intentionally leaves the analytical untruncated density unchanged.
  clip_untruncated_proposals: true
  include_anchor: true
  density_correction: true
  # Fixed beta=1 reproduces exact density correction.  Adaptive mode selects
  # the largest per-state beta whose 80 source weights retain the requested ESS.
  density_beta: 1.0
  adaptive_density_beta: false
  minimum_source_ess: 16.0
  density_beta_grid_size: 257
  source_q_eval: mean
  source_reference: uniform_action
  temperature: 0.25
  sinkhorn_epsilon: 0.05
  sinkhorn_iterations: 30
  transport_target_mode: argmax
  td_noise_std: 0.2
  td_noise_clip: 0.5
