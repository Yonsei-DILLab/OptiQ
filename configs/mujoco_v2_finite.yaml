# @package _global_
defaults:
  - mujoco_v2_checked
  - _self_

# Experimental actual finite mixture; not the continuous-latent confirmation.
alg:
  actor:
    latent_prior: finite
    latent_components: 16
    latent_codebook_seed: 20260911
    mean_latent_skip_scale: 0.5
    initial_log_std: -1.6094379124341003  # sigma=.2
    log_std_max: -1.6094379124341003

run_name: ${task}-v2-finite16-T${alg.actor.temperature}-s${seed}
output_root: outputs/v2_finite_screen
wandb:
  project: optiq_mujoco_v2_finite_screen
  group: ${env_name}_v2_finite16_T${alg.actor.temperature}
  job_type: screen
