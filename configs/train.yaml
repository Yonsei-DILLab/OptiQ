defaults:
  - /benchmark: humanoid
  - _self_

alg:
  tau: 0.005
  policy_tau: 1.0
  utd: 1
  gamma: 0.99
  policy_delay: 1
  batch_size: 256
  buffer_size: 1000000
  learning_starts: 5000
  reset_models: false
  ent_coef:
    type: const
    init: 0.0  # Teacher temperature is separate; no policy entropy bonus.
  critic:
    backup_mode: td
    activation: gelu
    n_critics: 2
    hs:
    - 256
    - 256
    dropout_rate: null
    use_layer_norm: false
    n_atoms: 1
    v_min: -3600
    v_max: 3600
    entr_coeff: 0.0
    type: scalar
    crossq_style: false
  optimizer:
    bn: false
    bn_momentum: 0.99
    bn_mode: brn_actor
    bn_warmup: 100000
    lr_critic: 0.0003
    lr_actor: 0.0003
    critic_b1: 0.9
    critic_b2: 0.999
    actor_b1: 0.9
    actor_b2: 0.999
    ac_grad_norm: null
  actor:
    hidden_dims:
    - 256
    - 256
    num_policy_samples: 64
    proposals_per_policy_sample: 1
    proposal_sampling_mode: exact
    proposal_std: ${.proposal_std_pretanh}
    proposal_clip: 0.5
    include_anchor: false
    density_correction: true
    density_beta: ${.density_correction_beta}
    adaptive_density_beta: false
    minimum_source_ess: 16.0
    density_beta_grid_size: 257
    source_q_eval: mean
    source_reference: uniform_action
    temperature: ${temperature}
    # Compatibility fields: unused by direct_gmm_nll (no OT is computed).
    ot_student_action: mean
    sinkhorn_epsilon: 0.1
    sinkhorn_iterations: 100
    transport_target_mode: argmax
    td_noise_std: 0.0
    td_noise_clip: 0.0
    learning_starts: 5000
    density_correction_beta: 1.0
    distillation_loss: direct_gmm_nll
    type: semi_implicit
    entropy_samples: 0  # No entropy-mixture evaluation in the TD backup.
    entropy_diagnostics: false
    log_std_min: -5.0
    log_std_max: -1.0
    initial_log_std: -1.0
    mean_output_init_scale: 0.0001
    log_std_output_init_scale: 0.0
    proposal_std_pretanh: ${.teacher_std_floor}
    normalize_ot_cost: false
    teacher_distribution: conditional_mixture
    teacher_std_floor: 0.006737946999085467
    soft_guard:
      enabled: false
  behavior_uniform_probability: 0.0
seed: 0
use_jit: true
require_gpu: true
total_steps: 1000000
eval_interval: 5000
num_eval_episodes: 10
eval_at_start: true
stochastic_eval: true
mu_only_eval: true  # If true: sample z, but evaluate tanh(mu(s,z)) with epsilon=0.
diagnostic_interval: 5000
checkpoint_interval: 100000
log_interval: 1
progress_bar: false
output_root: outputs
run_name: ${task}-ibolt-T${alg.actor.temperature}-s${seed}
wandb:
  activate: true
  mode: offline
  entity: null
  project: ibolt
  group: ${env_name}_T${alg.actor.temperature}
  job_type: training

dual_mu_eval: true
fixed_log_std: null
dacer:
  enabled: true
  target_entropy_per_dim: -0.9
  initial_alpha: 0.27
  alpha_lr: 0.03
  interval_updates: 10000
  components: 3
  samples: 200
  noise_scale: ${exploration_scale}
  entropy_seed: 42
  behavior_only: true
