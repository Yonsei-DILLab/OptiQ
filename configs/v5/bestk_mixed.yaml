# @package _global_
defaults:
  - /v5/bestk_combined
  - _self_

alg:
  # Half original Gaussian collection, half full-Gaussian best8 after warmup.
  behavior_best_of_k_probability: 0.5

output_root: ../optiq-experiments/v5_bestk_mixed/outputs
run_name: ${task}-v5-Kb8-prob${alg.behavior_best_of_k_probability}-bestkProposal8-mix${alg.actor.proposal_guided_fraction}-T${alg.actor.temperature}-eps${alg.actor.sinkhorn_epsilon}-s${seed}
wandb:
  group: ${env_name}_v5_Kb8_prob${alg.behavior_best_of_k_probability}_bestkProposal8_mix${alg.actor.proposal_guided_fraction}_T${alg.actor.temperature}_eps${alg.actor.sinkhorn_epsilon}
  job_type: v5-bestk-mixed
