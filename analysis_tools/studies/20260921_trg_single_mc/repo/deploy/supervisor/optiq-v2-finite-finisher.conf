[program:optiq-v2-finite-finisher]
directory=/workspace/OptiQ-v2
command=/workspace/OptiQ-v2/scripts/supervisor_v2_finite_finisher.sh
environment=PROC_NAME="%(program_name)s",OPTIQ_ROOT="/workspace/OptiQ-v2"
autostart=false
autorestart=false
startsecs=5
startretries=0
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
