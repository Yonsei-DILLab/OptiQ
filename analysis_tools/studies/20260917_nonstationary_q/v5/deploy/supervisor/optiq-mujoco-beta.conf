# Install after reviewing paths and GPU allocation; no jobs start automatically.
# supervisorctl reread; supervisorctl update; supervisorctl start 'optiq-mujoco-beta:*'
[program:optiq-mujoco-beta]
numprocs=4
process_name=%(program_name)s-%(process_num)s
directory=/workspace/OptiQ
command=/workspace/OptiQ/scripts/supervisor_mujoco_worker.sh --worker %(process_num)s 4
environment=CUDA_VISIBLE_DEVICES="%(process_num)s",OPTIQ_PYTHON="/workspace/.venv-optiq-mujoco/bin/python",PROC_NAME="%(program_name)s-%(process_num)s"
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
