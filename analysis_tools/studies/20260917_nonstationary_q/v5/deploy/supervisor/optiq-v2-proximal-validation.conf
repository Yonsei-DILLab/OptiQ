[program:optiq-v2-proximal-validation]
process_name=%(program_name)s-%(process_num)s
numprocs=2
directory=/workspace/OptiQ-v2
command=/workspace/OptiQ-v2/scripts/supervisor_v2_proximal_validation.sh %(process_num)s
environment=PROC_NAME="%(program_name)s-%(process_num)s",OPTIQ_ROOT="/workspace/OptiQ-v2"
autostart=false
autorestart=false
startsecs=10
startretries=0
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=180
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
