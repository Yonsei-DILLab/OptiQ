; Template only: install/start when a v3 training experiment is requested.
[program:optiq-v3]
process_name=%(program_name)s-%(process_num)s
numprocs=4
directory=/root/OptiQ-v3
command=/bin/bash /root/OptiQ-v3/scripts/supervisor_v3.sh %(process_num)s
environment=PROC_NAME="%(program_name)s-%(process_num)s"
autostart=false
autorestart=false
startsecs=1
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
