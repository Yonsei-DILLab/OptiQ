[program:optiq-v2-finite]
process_name=%(program_name)s-%(process_num)s
numprocs=4
directory=/workspace/OptiQ-v2
command=/workspace/OptiQ-v2/scripts/supervisor_v2_finite.sh %(process_num)s
environment=PROC_NAME="%(program_name)s-%(process_num)s",OPTIQ_ROOT="/workspace/OptiQ-v2"
autostart=false
autorestart=false
startsecs=15
startretries=0
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=180
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:optiq-v2-finite-monitor]
directory=/workspace/OptiQ-v2
command=/opt/supervisor-scripts/optiq-v2-finite-monitor.sh
environment=PROC_NAME="%(program_name)s",OMP_NUM_THREADS="1",OPENBLAS_NUM_THREADS="1"
autostart=false
autorestart=false
startsecs=5
startretries=0
stopsignal=INT
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
