[program:optiq-v2-confirmation]
process_name=%(program_name)s-%(process_num)s
numprocs=8
numprocs_start=0
directory=/workspace/OptiQ-v2
command=/workspace/OptiQ-v2/scripts/supervisor_v2_confirmation.sh %(process_num)s
environment=PROC_NAME="%(program_name)s-%(process_num)s",OPTIQ_ROOT="/workspace/OptiQ-v2",OPTIQ_CONFIRMATION_VARIANT="checked64"
autostart=false
autorestart=false
startsecs=15
startretries=0
stopsignal=INT
stopasgroup=true
killasgroup=true
stopwaitsecs=180
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
