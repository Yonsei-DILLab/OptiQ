[program:four-way-skewed-density-t64-seed4]
command=/workspace/DIME-skewed-proposal/scripts/run_four_way_skewed_density.sh 4 64 t64
directory=/workspace/DIME-skewed-proposal
environment=CUDA_VISIBLE_DEVICES="3"
